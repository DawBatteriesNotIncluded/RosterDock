name: release

# A tag v<version> publishes that version: the three images for linux/amd64 and linux/arm64 on GHCR, and the
# chart as an OCI artifact whose version and appVersion are the version, so it installs those images. CI
# (ci.yml) runs on the tagged commit first and must pass; the chart goes last, once every image is up.
# Run it from the Actions tab for a dry run: everything is built and nothing is pushed.
# The steps around a release, and what to switch on before the first, are in docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The version to build as, without the v (a dry run; nothing is pushed)
        required: true
        default: 0.0.0-dryrun

# Nothing by default; each job names what it needs, and only the two that push may write packages.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      push: ${{ steps.version.outputs.push }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then version="${TAG#v}" push=true; else version="$INPUT" push=false; fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a version: MAJOR.MINOR.PATCH, optionally with -prerelease"
            exit 1
          fi
          prerelease=false
          if [ -n "${BASH_REMATCH[4]}" ]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "prerelease=$prerelease"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version (push: $push, prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: image ${{ matrix.image }}
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # A failing image leaves the others to finish their pushes whole; re-run it alone, and the chart follows.
      fail-fast: false
      matrix:
        include:
          - image: rosterdock-board
            dockerfile: apps/board/Dockerfile
            # Never the model CLIs in a published image: Claude Code's licence does not allow passing it on.
            build-args: WITH_MODEL_CLIS=0
            description: "RosterDock board: the API, the event stream, Peter and the migrations."
          - image: rosterdock-web
            dockerfile: apps/web/Dockerfile
            build-args: ""
            description: "RosterDock web: the UI on nginx, /api proxied to the board."
          - image: rosterdock-worker
            dockerfile: apps/worker/Dockerfile
            build-args: WITH_CLAUDE_CODE=0
            description: "RosterDock worker: runs teammates on Codex or the stub engine. Claude Code is not included (docs/install.md)."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version, MAJOR.MINOR and latest; a prerelease gets its version only. The labels carry the
      # source repository (which links the package to it on GHCR) and the licence; the index annotations
      # carry the description GHCR shows for a multi-arch image.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      # The cache is CI's from main (a tag's own cache would serve no one else); it holds the amd64 layers.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: ${{ needs.version.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  chart:
    name: chart
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # Chart.yaml in the tree carries the version being prepared; the package takes the tag's either way.
      - name: package
        run: |
          in_tree="$(sed -n 's/^version: //p' deploy/helm/rosterdock/Chart.yaml)"
          if [ "$in_tree" != "$VERSION" ]; then
            echo "::warning::deploy/helm/rosterdock/Chart.yaml says $in_tree; the chart is published as $VERSION"
          fi
          helm lint deploy/helm/rosterdock --strict --set postgres.externalSecret.name=rosterdock-db
          helm package deploy/helm/rosterdock --version "$VERSION" --app-version "$VERSION" --destination dist
          helm show chart "dist/rosterdock-$VERSION.tgz"
          helm template rosterdock "dist/rosterdock-$VERSION.tgz" --set postgres.externalSecret.name=rosterdock-db | grep 'image:'
      - name: push
        if: needs.version.outputs.push == 'true'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/rosterdock-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
          helm show chart "oci://ghcr.io/$owner/charts/rosterdock" --version "$VERSION"
          {
            echo "Published $VERSION:"
            echo
            echo '```bash'
            echo "helm install rosterdock oci://ghcr.io/$owner/charts/rosterdock --version $VERSION -n rosterdock --create-namespace -f my-values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
