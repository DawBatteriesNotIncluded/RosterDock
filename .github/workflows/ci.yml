name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this on the tagged commit before it publishes anything.
  workflow_call:

# Every job here only reads the repository. Actions are pinned by commit, the tag beside it, and
# Dependabot (.github/dependabot.yml) moves both.
permissions:
  contents: read

concurrency:
  # Called from the release, github.workflow is the release's name: its CI never cancels main's.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rosterdock
          POSTGRES_PASSWORD: rosterdock
          POSTGRES_DB: rosterdock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rosterdock -d rosterdock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ROSTERDOCK_TEST_ADMIN_URL: postgres://rosterdock:rosterdock@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @rosterdock/web build

  images:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One cache scope per image: in the shared default scope each build overwrote the one before it.
      - name: rosterdock-board
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/board/Dockerfile
          push: false
          tags: rosterdock-board:ci
          cache-from: type=gha,scope=rosterdock-board
          cache-to: type=gha,mode=max,scope=rosterdock-board
      - name: rosterdock-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: rosterdock-web:ci
          cache-from: type=gha,scope=rosterdock-web
          cache-to: type=gha,mode=max,scope=rosterdock-web
      - name: rosterdock-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: rosterdock-worker:ci
          cache-from: type=gha,scope=rosterdock-worker
          cache-to: type=gha,mode=max,scope=rosterdock-worker

  smoke:
    # The chart installed for real: a kind cluster on the runner, the three images built and loaded into it,
    # Postgres and MinIO as pods, the release installed with the network policies on, the board curled
    # through the web. What deploy/scripts/smoke.sh does on a laptop, here on every push to main.
    name: smoke install on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: rosterdock-smoke
          wait: 120s
      - run: KIND=1 KEEP=0 deploy/scripts/smoke.sh
      - name: pods and events on failure
        if: failure()
        run: |
          kubectl -n rosterdock-smoke get pods -o wide || true
          kubectl -n rosterdock-smoke get events --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n rosterdock-smoke logs deploy/rosterdock-board --tail=100 || true

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/rosterdock --strict --set postgres.externalSecret.name=rosterdock-db
      - run: helm template rosterdock deploy/helm/rosterdock --set postgres.externalSecret.name=rosterdock-db > /dev/null
      - run: helm lint deploy/helm/rosterdock --strict -f deploy/helm/rosterdock/examples/production.yaml
      - run: helm template rosterdock deploy/helm/rosterdock -f deploy/helm/rosterdock/examples/production.yaml > /dev/null
