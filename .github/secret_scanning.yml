# Paths whose credentials are deliberate fakes, so secret scanning does not report them. None is real: the
# raw-secret guard's and the redaction tests' sample tokens, a self-signed key for the test SMTP server, and
# AWS's documented example key pair for the S3 request signer. Anywhere else, a match is a real alert.
paths-ignore:
  - "apps/board/test/fixtures/smtp/**"
  - "apps/board/test/*.test.ts"
  - "packages/shared/test/*.test.ts"
  - "apps/board/scripts/record-s3-fixtures.mts"
