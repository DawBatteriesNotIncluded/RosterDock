# Files whose credentials are deliberate fakes, so secret scanning does not report them. None is real: the
# raw-secret guard's and the redaction tests' sample tokens, a self-signed key for the test SMTP server, and
# AWS's documented example key pair for the S3 request signer. Each file is named, so a key anywhere else,
# another test file included, is a real alert. A new test with a fake token goes on this list.
paths-ignore:
  - "apps/board/test/fixtures/smtp/**"
  - "apps/board/test/approvals.test.ts"
  - "apps/board/test/auth.test.ts"
  - "apps/board/test/broker.test.ts"
  - "apps/board/test/checks.test.ts"
  - "apps/board/test/companies.test.ts"
  - "apps/board/test/connections.test.ts"
  - "apps/board/test/mcp.test.ts"
  - "apps/board/test/messages.test.ts"
  - "apps/board/test/runs.test.ts"
  - "apps/board/test/storage.test.ts"
  - "apps/board/test/templates.test.ts"
  - "packages/shared/test/secrets.test.ts"
  - "apps/board/scripts/record-s3-fixtures.mts"
