packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts run: esbuild fetches its platform binary. Every other script is skipped.
onlyBuiltDependencies:
  - esbuild

# Transitive packages held past their advisories where no parent has released a bump yet. Every parent's range
# already admits the fixed version; drop a line once the lockfile resolves it without one.
overrides:
  "source-map-js@<1.2.2": ^1.2.2
  "fast-uri@>=4.0.0 <4.1.5": ^4.1.5
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12

catalog:
  # runtime
  fastify: ^5.12.8
  "@fastify/cors": ^11.4.1
  "@fastify/cookie": ^11.1.5
  "@fastify/rate-limit": ^11.2.2
  pg: ^8.23.1
  zod: ^4.6.7
  react: ^19.3.1
  react-dom: ^19.3.1
  # tooling
  typescript: ^6.0.3
  tsx: ^4.23.15
  vitest: ^5.1.0
  eslint: ^10.14.0
  typescript-eslint: ^8.72.1
  prettier: ^3.9.10
  "@types/node": ^22.20.5
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.6
  "@vitejs/plugin-react": ^6.2.1
  tailwindcss: ^4.3.4
  "@tailwindcss/vite": ^4.3.4
