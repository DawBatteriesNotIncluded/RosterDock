packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts run: esbuild fetches its platform binary. Every other script is skipped.
onlyBuiltDependencies:
  - esbuild

catalog:
  # runtime
  fastify: ^5.12.5
  "@fastify/cors": ^11.3.1
  "@fastify/cookie": ^11.1.3
  pg: ^8.23.1
  zod: ^4.6.5
  react: ^19.3.0
  react-dom: ^19.3.0
  # tooling
  typescript: ^5.9.3
  tsx: ^4.23.15
  vitest: ^4.0.18
  eslint: ^10.12.0
  typescript-eslint: ^8.71.1
  prettier: ^3.9.9
  "@types/node": ^22.20.2
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
