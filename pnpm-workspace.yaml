packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts run: esbuild fetches its platform binary. Every other script is skipped.
onlyBuiltDependencies:
  - esbuild

# Transitive packages held past their advisories where no parent has released a bump yet. Every parent's range
# already admits the fixed version; drop a line once the lockfile resolves it without one.
overrides:
  "source-map-js@<1.2.2": ^1.2.2
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  "fast-uri@>=4.0.0 <4.2.3": ^4.2.3
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  "qs@>=6.7.0 <6.16.1": ^6.16.1
  "ip-address@<10.7.4": ^10.7.4

catalog:
  # runtime
  fastify: ^5.12.6
  "@fastify/cors": ^11.3.1
  "@fastify/cookie": ^11.1.3
  "@fastify/rate-limit": ^11.2.1
  pg: ^8.23.1
  zod: ^4.6.7
  react: ^19.3.1
  react-dom: ^19.3.1
  # tooling
  typescript: ^6.0.3
  tsx: ^4.23.15
  vitest: ^5.0.3
  eslint: ^10.12.0
  typescript-eslint: ^8.71.2
  prettier: ^3.9.10
  "@types/node": ^22.20.5
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
