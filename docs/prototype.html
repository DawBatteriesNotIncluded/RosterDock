<title>RosterDock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f6f5f2; --panel: #f1efea; --surface: #ffffff; --surface-2: #fbfaf8; --border: #e6e3dc; --border-soft: #efece6;
    --ink: #1c1b19; --ink-2: #4a4741; --muted: #6b675f; --faint: #b8b3aa;
    --accent: #1f7a5c; --accent-soft: #e2f1ea; --accent-ink: #1f6b52;
    --warn: #c98a1c; --warn-soft: #fbf1dd; --warn-ink: #8a5a0e; --warn-line: #f0dcb0;
    --info: #4f6bd8; --info-soft: #e3e8fa; --info-ink: #2f4bb5;
    --bad: #b3261e; --bad-soft: #fdecec; --bad-ink: #7a1c15;
    --add-bg: #e8f5ee; --add-ink: #14563f; --del-bg: #fdecec; --del-ink: #7a1c15;
    --btn: #1c1b19; --btn-ink: #f6f5f2;
    --av-p-bg: #e3e8fa; --av-p-ink: #2f4bb5; --av-r-bg: #e2f1ea; --av-r-ink: #1f6b52; --av-b-bg: #f6e7dd; --av-b-ink: #9a4f1c;
    --av-a-bg: #ece4f6; --av-a-ink: #63409a; --av-c-bg: #fdf0d8; --av-c-ink: #8a5a0e; --av-v-bg: #e9e9ec; --av-v-ink: #3b3b44; --av-rp-bg: #e0f0f4; --av-rp-ink: #1c6478;
    --shadow: 0 8px 30px rgba(28, 27, 25, 0.10);
    --sans: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141513; --panel: #191a17; --surface: #1e1f1c; --surface-2: #1a1b18; --border: #2c2e29; --border-soft: #262823;
      --ink: #ecebe6; --ink-2: #c9c7c0; --muted: #9a9d95; --faint: #5c5f58;
      --accent: #4fb58a; --accent-soft: #1b3a2e; --accent-ink: #8fdcb8;
      --warn: #e2b75a; --warn-soft: #3a2f16; --warn-ink: #f0d08a; --warn-line: #5a4720;
      --info: #8fa3ea; --info-soft: #1f2640; --info-ink: #b6c3f2;
      --bad: #e07a72; --bad-soft: #3d1f1c; --bad-ink: #f0a9a3;
      --add-bg: #1b3a2e; --add-ink: #a5e3c3; --del-bg: #3d1f1c; --del-ink: #f0a9a3;
      --btn: #ecebe6; --btn-ink: #141513;
      --av-p-bg: #26305a; --av-p-ink: #b6c3f2; --av-r-bg: #1b3a2e; --av-r-ink: #a5e3c3; --av-b-bg: #3f2a1c; --av-b-ink: #f0c3a2;
      --av-a-bg: #33264a; --av-a-ink: #cdb8f0; --av-c-bg: #3a2f16; --av-c-ink: #f0d08a; --av-v-bg: #2c2e33; --av-v-ink: #d0d2da; --av-rp-bg: #17333b; --av-rp-ink: #a3dbe8;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #141513; --panel: #191a17; --surface: #1e1f1c; --surface-2: #1a1b18; --border: #2c2e29; --border-soft: #262823;
    --ink: #ecebe6; --ink-2: #c9c7c0; --muted: #9a9d95; --faint: #5c5f58;
    --accent: #4fb58a; --accent-soft: #1b3a2e; --accent-ink: #8fdcb8;
    --warn: #e2b75a; --warn-soft: #3a2f16; --warn-ink: #f0d08a; --warn-line: #5a4720;
    --info: #8fa3ea; --info-soft: #1f2640; --info-ink: #b6c3f2;
    --bad: #e07a72; --bad-soft: #3d1f1c; --bad-ink: #f0a9a3;
    --add-bg: #1b3a2e; --add-ink: #a5e3c3; --del-bg: #3d1f1c; --del-ink: #f0a9a3;
    --btn: #ecebe6; --btn-ink: #141513;
    --av-p-bg: #26305a; --av-p-ink: #b6c3f2; --av-r-bg: #1b3a2e; --av-r-ink: #a5e3c3; --av-b-bg: #3f2a1c; --av-b-ink: #f0c3a2;
    --av-a-bg: #33264a; --av-a-ink: #cdb8f0; --av-c-bg: #3a2f16; --av-c-ink: #f0d08a; --av-v-bg: #2c2e33; --av-v-ink: #d0d2da; --av-rp-bg: #17333b; --av-rp-ink: #a3dbe8;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--ground); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .app { display: flex; height: 100vh; min-height: 640px; overflow: hidden; }
  .sidebar { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; background: var(--panel); border-right: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--btn); display: flex; align-items: center; justify-content: center; }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .nav { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 9px 10px; border-radius: 8px; color: var(--ink-2); font-size: 14px; text-align: left; border: 1px solid transparent; transition: background .12s; }
  .nav:hover { background: var(--surface-2); }
  .nav.active { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 600; }
  .nav .l { display: flex; align-items: center; gap: 10px; }
  .nav svg { color: var(--muted); }
  .nav.active svg { color: var(--ink); }
  .badge { font-size: 12px; font-weight: 600; color: var(--ink); background: var(--border); border-radius: 10px; padding: 1px 7px; min-width: 20px; text-align: center; }
  .badge.warn { color: #fff; background: var(--warn); }
  :root[data-theme="dark"] .badge.warn { color: #141513; }
  .sidebar-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
  .theme-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; width: 100%; }
  .theme-toggle:hover { background: var(--surface-2); color: var(--ink); }

  .main { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--border); }
  .topbar-l { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .subtitle { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-r { display: flex; align-items: center; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.warn:hover { filter: brightness(0.97); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); } .dot.idle { background: var(--faint); } .dot.bad { background: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: filter .12s, background .12s; white-space: nowrap; }
  .btn.primary { background: var(--btn); color: var(--btn-ink); }
  .btn.primary:hover { filter: brightness(1.15); }
  .btn.accent { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn.accent { color: #0f1f18; }
  .btn.accent:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--surface); border-color: var(--border); color: var(--ink); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { background: var(--surface); border-color: var(--border); color: var(--bad); }
  .btn.block { width: 100%; padding: 11px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .segs { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 8px; background: var(--border); }
  :root[data-theme="dark"] .segs { background: var(--border-soft); }
  .seg { padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--ink-2); border: 1px solid transparent; }
  .seg.active { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 600; }

  .content { flex-grow: 1; display: flex; min-height: 0; }
  .scroll { overflow: auto; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

  .av { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .av.s { width: 22px; height: 22px; font-size: 10px; } .av.m { width: 26px; height: 26px; font-size: 11px; } .av.l { width: 30px; height: 30px; font-size: 12px; } .av.xl { width: 40px; height: 40px; font-size: 15px; }
  .av.peter { background: var(--av-p-bg); color: var(--av-p-ink); } .av.ricky { background: var(--av-r-bg); color: var(--av-r-ink); }
  .av.brody { background: var(--av-b-bg); color: var(--av-b-ink); } .av.archy { background: var(--av-a-bg); color: var(--av-a-ink); }
  .av.cody, .av.cody2, .av.cody3 { background: var(--av-c-bg); color: var(--av-c-ink); } .av.verifier { background: var(--av-v-bg); color: var(--av-v-ink); }
  .av.reporter { background: var(--av-rp-bg); color: var(--av-rp-ink); } .av.you { background: var(--btn); color: var(--btn-ink); }
  .av.finn { background: var(--av-rp-bg); color: var(--av-rp-ink); }
  .role { font-size: 11px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .tool { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .tool.gate { color: var(--warn-ink); border-color: var(--warn-line); background: var(--warn-soft); }
  .pill { font-size: 12px; font-weight: 600; border-radius: 10px; padding: 3px 9px; white-space: nowrap; }
  .pill.ok { color: var(--accent-ink); background: var(--accent-soft); } .pill.warn { color: var(--warn-ink); background: var(--warn-soft); }
  .pill.info { color: var(--info-ink); background: var(--info-soft); } .pill.bad { color: var(--bad-ink); background: var(--bad-soft); } .pill.muted { color: var(--muted); background: var(--panel); }

  /* Company */
  .company { flex-grow: 1; padding: 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .meter { width: 160px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); }
  .depts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .dept { display: flex; flex-direction: column; padding: 18px; gap: 14px; }
  .lead { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; background: var(--ground); }
  .member { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; border-radius: 8px; padding: 4px; margin: -4px; }
  .member:hover { background: var(--surface-2); }
  .member .name { font-size: 13px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .status.warn { color: var(--warn-ink); } .status.bad { color: var(--bad-ink); }
  .dept-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border-soft); font-size: 13px; margin-top: auto; }
  .add-dept { display: inline-flex; align-items: center; gap: 10px; padding: 14px 18px; border: 1px dashed var(--faint); border-radius: 10px; color: var(--muted); font-size: 13px; width: fit-content; }
  .add-dept:hover { color: var(--ink); border-color: var(--muted); }

  .rail { width: 340px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface-2); padding: 24px 22px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
  .feed { display: flex; flex-direction: column; gap: 12px; }
  .feed-item { display: flex; gap: 10px; width: 100%; text-align: left; padding: 8px; margin: -8px; border-radius: 8px; }
  .feed-item:hover { background: var(--surface); }
  .feed-item.attention { background: var(--warn-soft); border: 1px solid var(--warn-line); padding: 12px; margin: 0; }
  .feed-item .txt { font-size: 13px; line-height: 1.45; }
  .feed-item .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .feed-item.attention .meta { color: var(--warn-ink); font-weight: 600; }

  /* Board */
  .board { flex-grow: 1; display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; padding: 22px 22px 22px 28px; min-width: 0; overflow: auto; align-content: start; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 200px; border-radius: 10px; padding: 2px; transition: background .12s; }
  .col.over { background: var(--panel); }
  .col-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .col-h.blocked { color: var(--bad); }
  .tcard { display: flex; flex-direction: column; gap: 8px; padding: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: grab; transition: box-shadow .12s, transform .12s; }
  .tcard:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .tcard.selected { border: 2px solid var(--ink); padding: 11px; }
  .tcard.done { background: var(--surface-2); border-color: var(--border-soft); opacity: .85; cursor: default; }
  .tcard.done:hover { box-shadow: none; transform: none; }
  .tcard.blocked { border-color: var(--bad); border-left-width: 3px; }
  .tcard .t { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .tcard.done .t { color: var(--ink-2); }
  .tcard .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .tcard .foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .tcard.dragging { opacity: .5; }

  .drawer { width: 420px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .drawer-h { padding: 20px 22px 14px; border-bottom: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 10px; }
  .drawer-title { font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
  .tabs { display: flex; gap: 18px; padding: 0 22px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .tab { padding: 12px 0 10px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .thread { flex-grow: 1; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; }
  .msg .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .msg .hd { display: flex; align-items: baseline; gap: 8px; }
  .msg .hd b { font-size: 13px; }
  .msg .hd span { font-size: 12px; color: var(--muted); }
  .msg p { margin: 0; font-size: 13px; line-height: 1.5; }
  .code { font-family: var(--mono); font-size: 12px; background: var(--panel); padding: 0 4px; border-radius: 4px; }
  .event { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--ground); border: 1px solid var(--border); font-size: 12px; }
  .sysline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding-left: 36px; }
  .composer { padding: 14px 22px 18px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 8px; }
  .composer-box { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  .composer-box input { flex-grow: 1; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; outline: none; min-width: 0; }
  .composer-box input::placeholder { color: var(--faint); }
  .send { width: 30px; height: 30px; border-radius: 7px; background: var(--btn); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .hint { font-size: 12px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); margin: 0; } .kv dd { margin: 0; }
  .outfile { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .blockbox { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 8px; background: var(--bad-soft); border: 1px solid var(--bad); color: var(--bad-ink); font-size: 13px; }
  :root[data-theme="dark"] .blockbox { border-color: #6a3a35; }

  /* Review */
  .review { flex-grow: 1; display: flex; min-height: 0; }
  .files { width: 270px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--panel); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .file { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 12px; color: var(--ink-2); border: 1px solid transparent; text-align: left; }
  .file:hover { background: var(--surface-2); }
  .file.active { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 600; }
  .file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plus { color: var(--accent); } .minus { color: var(--bad); }
  .diffwrap { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); overflow: auto; }
  .diff-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .diff { font-family: var(--mono); font-size: 12.5px; line-height: 22px; display: flex; flex-direction: column; padding-bottom: 40px; }
  .hunk { display: flex; align-items: center; gap: 12px; padding: 4px 20px; background: var(--ground); color: var(--muted); border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
  .hunk span:last-child { font-family: var(--sans); font-size: 12px; }
  .ln { display: flex; min-width: 0; position: relative; }
  .ln:hover .addc { opacity: 1; }
  .ln .n { width: 44px; text-align: right; color: var(--faint); padding-right: 10px; flex-shrink: 0; user-select: none; }
  .ln .c { padding-left: 12px; color: var(--ink-2); white-space: pre; overflow-x: auto; }
  .ln.add { background: var(--add-bg); } .ln.add .n { color: var(--accent); } .ln.add .c { color: var(--add-ink); }
  .ln.del { background: var(--del-bg); } .ln.del .n { color: var(--bad); } .ln.del .c { color: var(--del-ink); }
  .ln.flag { box-shadow: inset 3px 0 0 var(--warn); }
  .addc { position: absolute; left: 96px; top: 2px; width: 18px; height: 18px; border-radius: 4px; background: var(--info); color: #fff; font-size: 14px; line-height: 18px; text-align: center; opacity: 0; transition: opacity .12s; }
  .cthread { margin: 8px 20px 12px 108px; border: 1px solid var(--warn-line); border-radius: 10px; background: var(--warn-soft); display: flex; flex-direction: column; font-family: var(--sans); line-height: 1.5; }
  .cthread.resolved { border-color: var(--border); background: var(--surface-2); }
  .cthread .msg { padding: 12px 14px; }
  .cthread .msg + .msg { padding-top: 0; }
  .cthread .foot { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-top: 1px solid var(--warn-line); }
  .cthread.resolved .foot { border-top-color: var(--border); }

      <button class="lead" data-go="mate:${d.lead}">${av(d.lead, 'l')}<div style="display:flex;flex-direction:column;min-width:0;text-align:left"><span style="font-size:13px;font-weight:600">${esc(lead.name)} · Lead</span><span style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${leadTask ? esc(leadTask.title) : (d.id === 'engineering' ? 'Planning · splitting “HubSpot daily summary”' : d.id === 'marketing' ? 'Writing · weekly pipeline summary' : 'Coordinating')}</span></div></button>

  }
  function memberRow(id, dt) {
    const a = AGENTS[id];

      else if (t.status === 'review') st = `<span class="status" style="color:var(--info-ink)"><span class="dot info"></span>In review · ${esc(t.title)}</span>`;
      else if (t.status === 'blocked') st = `<span class="status bad"><span class="dot bad"></span>Blocked · ${esc(t.title)}</span>`;
      else st = `<span class="status"><span class="dot idle"></span>Queued · ${esc(t.title)}</span>`;

    return `<button class="member" data-go="task:${t ? t.id : ''}" ${t ? '' : 'data-go="mate:' + id + '"'}>${av(id, 'l')}<div style="display:flex;flex-direction:column;gap:4px;min-width:0"><div style="display:flex;align-items:center;gap:8px"><span class="name">${esc(a.name)}</span><span class="role">${esc(a.role)}</span></div>${st}<div style="display:flex;gap:6px;flex-wrap:wrap">${a.tools.map((m) => `<span class="tool">${esc(m)}</span>`).join('')}</div></div></button>`;

  const feedItem = (f) => `<button class="feed-item ${f.attention ? 'attention' : ''}" data-go="${f.go || ''}">${av(f.who, 'm')}<div><div class="txt">${f.html}</div><div class="meta">${esc(f.meta)}${f.attention ? ' →' : ''}</div></div></button>`;

  VIEWS.board = () => {
    const cols = [['todo', 'To do'], ['doing', 'In progress'], ['blocked', 'Blocked'], ['review', 'In review'], ['done', 'Done']];
    const vis = tasks().filter((t) => (S.deptFilter === 'all' || t.dept === S.deptFilter) && (S.project === 'all' || t.project === S.project));
    const segs = `<div class="segs">${[['all', 'All'], ...Object.values(D()).map((d) => [d.id, d.name])].map(([k, l]) => `<button class="seg ${S.deptFilter === k ? 'active' : ''}" data-filter="${k}">${esc(l)}</button>`).join('')}</div>`;
    const projSel = `<select class="btn ghost" data-projsel style="padding:7px 10px;font-weight:500;appearance:auto"><option value="all" ${S.project === 'all' ? 'selected' : ''}>All projects</option>${Object.values(P()).map((p) => `<option value="${p.id}" ${S.project === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
    return topbar('Board', '', `<button class="btn primary" data-act="newgoal">${I.plus}<span>New goal</span></button>`).replace('</span></div><div class="topbar-r">', `</span>${projSel}${segs}</div><div class="topbar-r">`) + `
      <div class="content">
        <div class="board" id="board">${cols.map(([k, l]) => {
          const list = vis.filter((t) => t.status === k).sort((a, b) => b.id - a.id);
          return `<div class="col" data-col="${k}"><div class="col-h ${k === 'blocked' ? 'blocked' : ''}"><span>${l}</span><span class="mono" style="font-weight:400">${list.length}${k === 'done' ? ' this week' : ''}</span></div>${list.map(taskCard).join('')}${list.length === 0 ? `<div style="border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:center;font-size:12px;color:var(--faint)">${k === 'blocked' ? 'Nothing blocked' : 'Empty'}</div>` : ''}</div>`;
        }).join('')}</div>
        ${S.selTask ? drawer(T[S.selTask]) : ''}
      </div>`;
  };
  function taskCard(t) {
    const done = t.status === 'done';
    return `<button class="tcard ${done ? 'done' : ''} ${t.status === 'blocked' ? 'blocked' : ''} ${S.selTask === t.id ? 'selected' : ''}" draggable="${done ? 'false' : 'true'}" data-task="${t.id}">
      <span class="t">${esc(t.title)}</span>
      ${done ? '' : `<span class="who">${av(t.assignee, 's')}<span>${agentLabel(t.assignee)}</span></span>`}
      ${statusLine(t)}
      <span class="foot"><span>${done ? esc(t.doneBy || '') : (t.msgs ? `<span style="display:inline-flex;align-items:center;gap:4px">${I.msg}${t.msgs}</span>` : (t.by === 'you' ? 'Created by you' : 'Created by ' + esc(AGENTS[t.by].name)))}</span><span class="mono">#${t.id}</span></span>
    </button>`;
  }
  function drawer(t) {
    const a = AGENTS[t.assignee];
    const tools = a.tools.flatMap((m) => Object.entries(TOOLMODES[a.id][m]).filter(([, mode]) => mode !== 'off').map(([tl, mode]) => ({ m, tl, mode })));
    const toolChips = Object.entries(tools.reduce((acc, x) => { (acc[x.m] = acc[x.m] || new Set()).add(x.mode); return acc; }, {})).map(([m, modes]) => {
      const out = [];
      if (modes.has('read')) out.push(`<span class="tool">${m} · read</span>`);
      if (modes.has('auto')) out.push(`<span class="tool">${m} · draft</span>`);
      if (modes.has('ask')) out.push(`<span class="tool gate">${m} · write ⋅ approval</span>`);
      return out.join('');
    }).join('');
    const status = t.status === 'doing' ? `<span class="status" style="font-weight:600;color:var(--accent)"><span class="dot ok"></span>Running · ${esc(t.running || 'just started')}</span>` : t.status === 'blocked' ? `<span class="pill bad">Blocked</span>` : t.status === 'review' ? `<span class="pill info">In review</span>` : t.status === 'done' ? `<span class="pill ok">Done</span>` : `<span class="pill muted">Queued</span>`;
    const tabs = [['conv', 'Conversation'], ['out', 'Output'], ['act', 'Activity']];
    let body = '';
    if (S.drawerTab === 'conv') body = `<div class="thread">${t.blocker ? `<div class="blockbox"><b style="font-weight:600">Blocked · ${t.blocker.kind === 'approval' ? 'needs your approval' : t.blocker.kind === 'dependency' ? 'dependency' : 'waiting on a teammate'}</b><span>${esc(t.blocker.text)}</span>${t.blocker.kind === 'approval' ? `<a data-go="approvals" style="font-weight:600">Review the action →</a>` : t.blocker.kind === 'dependency' ? `<a data-go="task:145" style="font-weight:600">Open #145 →</a>` : `<a data-go="agent:brody" style="font-weight:600">Nudge Brody →</a>`}</div>` : ''}${t.thread.length ? t.thread.map(msgRow).join('') : '<div class="empty">No messages yet. Anything you write here rides into the next run as standing instructions.</div>'}</div>
      <div class="composer"><form class="composer-box" data-form="msg"><input id="msgInput" placeholder="Message the team… @mention to route" autocomplete="off"><button class="send" type="submit" aria-label="Send">${I.arrow}</button></form><span class="hint">Your notes ride into ${esc(a.name)}’s next run as standing instructions.</span></div>`;
    else if (S.drawerTab === 'out') body = `<div class="thread">${t.outputs.length ? t.outputs.map((o) => `<div class="outfile"><span class="mono" style="font-size:12px">${esc(o.n)}</span><span style="color:var(--muted);font-size:12px">${esc(o.k)}</span></div>`).join('') : '<div class="empty">Nothing produced yet.</div>'}${t.review ? `<button class="btn ghost" data-go="review:${t.review}">Open review #${t.id}</button>` : ''}</div>`;
    else body = `<div class="thread"><dl class="kv"><dt>Created</dt><dd>by ${t.by === 'you' ? 'you' : esc(AGENTS[t.by].name)}</dd><dt>Assigned</dt><dd>${esc(a.name)} · ${esc(a.role)}</dd><dt>Engine</dt><dd>${esc(a.brain)}</dd><dt>Runs</dt><dd>${t.status === 'todo' ? 'none yet' : '1 · sandboxed worktree'}</dd><dt>Tokens</dt><dd class="mono">${t.status === 'todo' ? '0' : t.id === 142 ? '68,775' : '31,208'}</dd></dl></div>`;
    return `<aside class="drawer">
      <div class="drawer-h">
        <div class="row"><span class="mono" style="font-size:12px;color:var(--muted)">#${t.id} · ${esc((D()[t.dept] || { name: '' }).name)}${t.project && P()[t.project] ? ' · ' + esc(P()[t.project].name) : ''}</span><div style="display:flex;align-items:center;gap:10px">${status}<button data-act="closeDrawer" aria-label="Close" style="color:var(--muted);font-size:18px;line-height:1">×</button></div></div>

        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)">${av(t.assignee, 's')}<span><b>${esc(a.name)}</b> · ${esc(a.role)}</span><span style="color:var(--faint)">·</span><span>created by ${t.by === 'you' ? 'you' : esc(AGENTS[t.by].name)}</span></div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--muted)">Toolbox</span>${toolChips || '<span class="tool">none</span>'}</div>
        ${t.review ? `<button class="btn ghost" data-go="review:${t.review}" style="align-self:flex-start">Open review</button>` : ''}

      <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.drawerTab === k ? 'active' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>

    `<div class="msg">${av(m.who, 'm')}<div class="body"><div class="hd"><b>${m.who === 'you' ? 'You' : esc(AGENTS[m.who].name)}</b><span>${esc(m.when)}</span></div><p>${m.html || esc(m.text)}</p>${m.event ? `<button class="event" data-go="${m.event.go}">${I.task}<span>${m.event.text}</span></button>` : ''}${m.routed ? `<span class="event" style="width:fit-content"><span class="dot ok"></span><span>Routed to <b>${esc(m.routed)}</b> · will pick this up on their next turn</span></span>` : ''}</div></div>`;

  VIEWS.reviews = () => {
    const r = REVIEWS[S.selReview];

    const f = r.files[Math.min(S.selFile, r.files.length - 1)];
    const totals = r.files.reduce((a, x) => ({ add: a.add + x.add, del: a.del + x.del }), { add: 0, del: 0 });
    const openComments = Object.values(r.comments).filter((c) => !c.resolved).length;
    const statusPill = r.status === 'changes' ? '<span class="pill warn">Changes requested</span>' : r.status === 'approved' ? '<span class="pill ok">Approved · PR opened</span>' : '<span class="pill info">In review</span>';
    const others = Object.values(REVIEWS).filter((x) => x.id !== r.id);
    return `<div class="topbar"><div class="topbar-l"><button class="btn ghost" data-view="board" style="padding:6px 10px">${I.back}<span>Board</span></button><span class="mono" style="font-size:13px;color:var(--muted)">#${t.id}</span><span class="title" style="font-size:17px">${esc(t.title)}</span>${statusPill}</div>
      <div class="topbar-r"><div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)">${av(r.author, 's')}<span>${agentLabel(r.author)}</span><span style="color:var(--faint)">${I.arrow}</span>${av(r.reviewer, 's')}<span>${esc(AGENTS[r.reviewer].name)}</span><span style="color:var(--faint)">+</span>${av('you', 's')}<span>You</span></div>
      ${others.length ? `<div class="segs">${Object.values(REVIEWS).map((x) => `<button class="seg ${x.id === r.id ? 'active' : ''}" data-review="${x.id}">#${x.task}</button>`).join('')}</div>` : ''}</div></div>
      <div class="review">
        <div class="files"><div class="row" style="padding:0 8px 10px"><span class="eyebrow">${r.files.length} files</span><span class="mono" style="font-size:12px"><span class="plus">+${totals.add}</span> <span class="minus">−${totals.del}</span></span></div>
          ${r.files.map((x, i) => `<button class="file ${i === S.selFile ? 'active' : ''}" data-file="${i}"><span class="name mono">${esc(x.n)}</span><span class="mono" style="font-size:11px;flex-shrink:0"><span class="plus">+${x.add}</span>${x.del ? ` <span class="minus">−${x.del}</span>` : ''}</span></button>`).join('')}
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 10px;border-top:1px solid var(--border)"><span style="font-size:12px;font-weight:600;color:var(--muted)">Also produced</span>${t.outputs.filter((o) => !r.files.some((x) => x.n === o.n)).map((o) => `<span style="font-size:13px"><a>${esc(o.n)}</a> · ${esc(o.k)}</span>`).join('') || '<span style="font-size:12px;color:var(--muted)">Nothing else</span>'}</div>
        </div>
        <div class="diffwrap">
          <div class="diff-h"><span class="mono" style="font-size:13px;font-weight:500">${esc(f.n)}</span><div class="segs" style="font-size:12px"><span class="seg active">Unified</span><span class="seg" style="opacity:.6">Split</span></div></div>
          <div class="diff">${f.hunks.map((h) => `<div class="hunk"><span>${esc(h.h)}</span><span>${esc(h.label)}</span></div>${h.lines.map((l) => diffLine(l, r)).join('')}`).join('')}</div>
        </div>
        <aside class="rpanel">
          <div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Checks</span><div class="checks">${r.checks.map((c) => `<div class="check"><span style="color:var(--accent)">${I.check}</span><span>${esc(c.t)}</span></div>`).join('')}${openComments ? `<div class="check warn"><span style="color:var(--warn)">${I.alert}</span><span>${openComments} open comment${openComments > 1 ? 's' : ''}</span></div>` : ''}</div></div>
          <div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Reviewers</span>
            <div class="reviewer"><span style="display:flex;align-items:center;gap:8px">${av(r.reviewer, 's')}<span>${esc(AGENTS[r.reviewer].name)}</span></span><span style="font-size:12px;font-weight:600;color:${r.status === 'changes' ? 'var(--warn-ink)' : r.status === 'approved' ? 'var(--accent-ink)' : 'var(--info-ink)'}">${r.status === 'changes' ? 'Changes requested' : r.status === 'approved' ? 'Approved' : 'Reviewing'}</span></div>
            <div class="reviewer"><span style="display:flex;align-items:center;gap:8px">${av('you', 's')}<span>You</span></span><span style="font-size:12px;color:var(--muted)">${r.youDecided || 'Optional'}</span></div></div>
          <div style="display:flex;flex-direction:column;gap:8px"><button class="btn accent block" data-act="approve" ${r.status === 'approved' ? 'disabled' : ''}>${r.status === 'approved' ? 'Approved' : 'Approve'}</button><button class="btn ghost block" data-act="reqchanges" ${r.status === 'approved' ? 'disabled' : ''}>Request changes</button></div>
          <div class="note"><span class="eyebrow">${r.status === 'approved' ? 'Approved' : 'When approved'}</span><span>${r.status === 'approved' ? `Pull request opened to <span class="mono" style="font-size:12px">${esc(r.repo)}</span>. The draft is imported inactive.` : `Opens a pull request to <span class="mono" style="font-size:12px">${esc(r.repo)}</span>. The draft workflow is imported inactive.`}</span><span class="chip warn" style="width:fit-content;padding:6px 10px;font-size:12px"><span class="dot warn"></span>Merge and activation both need you</span></div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)"><span>Run · ${esc(r.run)}</span><span>${esc(r.engine)}</span></div>
        </aside>
      </div>`;
  };
  function diffLine(l, r) {
    const [kind, a, b, text, cid] = l;

    const c = cid && r.comments[cid];
    const ok = cid && r.oks[cid];
    let html = `<div class="ln ${cls} ${c && !c.resolved ? 'flag' : ''}"><span class="n">${a}</span><span class="n">${b}</span><span class="c">${esc(text)}</span><button class="addc" data-addc="${cid || ''}" title="Comment on this line">+</button></div>`;
    if (c) html += `<div class="cthread ${c.resolved ? 'resolved' : ''}">${c.msgs.map((m) => `<div class="msg">${av(m.who, 'm')}<div class="body"><div class="hd"><b>${m.who === 'you' ? 'You' : esc(AGENTS[m.who].name)}</b>${m.tag ? `<span class="pill warn" style="font-size:11px;padding:1px 7px">${esc(m.tag)}</span>` : ''}<span>${esc(m.when)}</span></div><p>${m.html || esc(m.text)}</p></div></div>`).join('')}
      <form class="foot" data-form="reply" data-cid="${cid}"><input placeholder="Reply…" autocomplete="off"><button type="submit" class="btn ghost" style="padding:5px 10px;font-size:12px">Reply</button>${c.resolved ? '<span style="font-size:12px;color:var(--muted);padding:0 6px">Resolved</span>' : `<button type="button" class="btn ghost" data-resolve="${cid}" style="padding:5px 10px;font-size:12px">Resolve</button>`}</form></div>`;

  }

  VIEWS.approvals = () => {
    const list = Object.values(APPROVALS).filter((a) => T[a.task].company === S.company).sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1));
    return topbar('Approvals', `${esc(COMPANIES[S.company].name)} · actions that touch a live system wait here for you`) + `
      <div class="content"><div class="approvals scroll">
        <p style="margin:0;font-size:13px;color:var(--muted);line-height:1.5;max-width:64ch">Each card is the exact action a teammate wants to take, bound to a hash so the approved bytes are the executed bytes. Credentials are named, never shown.</p>
        ${list.map(approvalCard).join('')}
      </div></div>`;
  };
  function approvalCard(a) {
    const t = T[a.task];
    return `<div class="card approval ${a.status !== 'pending' ? 'decided' : ''}">
      <div class="row"><div style="display:flex;align-items:center;gap:10px">${av(a.who, 'l')}<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${esc(a.title)}</span><span style="font-size:12px;color:var(--muted)">${agentLabel(a.who)} · ${esc((D()[t.dept] || { name: '' }).name)} · ${esc((P()[t.project] || { name: '' }).name)} · from <a data-go="task:${t.id}">#${t.id} ${esc(t.title)}</a></span></div></div>${a.status === 'pending' ? '<span class="pill warn">Waiting on you</span>' : a.status === 'approved' ? '<span class="pill ok">Approved · executed</span>' : '<span class="pill bad">Rejected</span>'}</div>
      <div class="why"><b style="font-weight:600">Why:</b> ${esc(a.why)}</div>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Exact action · <span class="mono" style="text-transform:none;letter-spacing:0">${esc(a.tool)}</span></span><pre class="action-json">${esc(a.payload)}</pre></div>
      ${a.status === 'pending' ? `<div class="acts"><button class="btn accent" data-approve="${a.id}">Approve and run</button><button class="btn danger" data-reject="${a.id}">Reject</button><button class="btn ghost" data-go="task:${t.id}">Ask a question first</button></div>` : `<span style="font-size:12px;color:var(--muted)">${esc(a.decidedNote || '')}</span>`}
    </div>`;
  }

  VIEWS.activity = () => topbar('Activity', `${esc(COMPANIES[S.company].name)} · everything the team did, newest first`) + `<div class="content"><div class="activity scroll"><div class="feed">${feed().map(feedItem).join('') || '<div class="empty">No activity in this company yet.</div>'}</div></div></div>`;

  VIEWS.team = () => {
    const a = AGENTS[S.selMate];
    const modes = TOOLMODES[a.id];
    return topbar('Team', 'Every teammate is a brain, a persona and a toolbox', `<button class="btn primary" data-act="hire">${I.plus}<span>Hire from template</span></button>`) + `
      <div class="team">
        <div class="roster">${Object.values(D()).map((d) => `<span class="eyebrow">${esc(d.name)}</span>${[d.lead, ...d.members].map((id) => `<button class="rmate ${S.selMate === id ? 'active' : ''}" data-mate="${id}">${av(id, 'l')}<div style="display:flex;flex-direction:column;min-width:0"><span style="font-size:13px;font-weight:600">${esc(AGENTS[id].name)}${AGENTS[id].lead ? ' · Lead' : ''}</span><span style="font-size:12px;color:var(--muted)">${esc(AGENTS[id].role)}</span></div></button>`).join('')}`).join('')}</div>
        <div class="editor">

      const id = 'co-' + (++seq); const tpl = String(fd.get('tpl'));
      const depts = tpl === 'gtm' ? { engineering: { id: 'engineering', name: 'Engineering', lead: 'peter', members: ['cody', 'verifier'], policy: 'drafts' }, research: { id: 'research', name: 'Research', lead: 'ricky', members: ['brody'], policy: 'readonly' }, marketing: { id: 'marketing', name: 'Marketing Ops', lead: 'reporter', members: ['cody3'], policy: 'ask' } }
        : tpl === 'studio' ? { build: { id: 'build', name: 'Build cell', lead: 'peter', members: ['cody', 'cody2', 'verifier'], policy: 'drafts' }, docs: { id: 'docs', name: 'Docs shop', lead: 'reporter', members: ['brody'], policy: 'readonly' }, audit: { id: 'audit', name: 'Audit office', lead: 'verifier', members: [], policy: 'readonly' } }
        : tpl === 'agency' ? { research: { id: 'research', name: 'Research', lead: 'ricky', members: ['brody', 'archy'], policy: 'readonly' } } : {};
      COMPANIES[id] = { id, name, template: f.querySelector('select[name="tpl"] option:checked').textContent.split(' · ')[0], depts, projects: {} };
      S.modal = null; switchCompany(id); toast(`${name} created. Hand Peter a goal to open its first project.`);
    }));
    root.querySelectorAll('form[data-form="project"]').forEach((f) => f.addEventListener('submit', (e) => {
      e.preventDefault(); const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); if (!name) return;
      const id = 'p-' + (++seq); P()[id] = { id, name, client: String(fd.get('client') || '').trim() || 'Internal' };
      feedPush({ who: 'you', html: `<b>You</b> opened project <b>${esc(name)}</b>`, meta: 'now · no tasks yet', go: 'project:' + id });
      S.modal = null; S.view = 'board'; S.project = id; toast(`${name} opened. Hand Peter a goal to fill it.`); render();
    }));
  }

  function act(a) {
    if (a === 'theme') { const r = document.documentElement; const cur = r.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); return; }
    if (a === 'closeDrawer') { S.selTask = null; render(); return; }
    if (a === 'closeModal') { S.modal = null; render(); return; }
    if (a === 'companyMenu') { S.companyMenu = !S.companyMenu; render(); return; }
    if (a === 'newcompany') { S.companyMenu = false; S.modal = createCompanyModal(); render(); return; }
    if (a === 'newproject') { S.modal = createProjectModal(); render(); return; }
    if (a === 'newdept' || a === 'adddept') { S.modal = createDeptModal(); render(); return; }
    if (a === 'designTeam') { S.modal = designTeamModal({ phase: 'input' }); render(); return; }
    if (a === 'acceptDesign') { acceptDesign(); return; }
    if (a === 'newgoal') { S.modal = goalModal({ phase: 'input' }); render(); return; }
    if (a === 'acceptPlan') { acceptPlan(); return; }
    if (a === 'approve') { const r = REVIEWS[S.selReview]; const open = Object.values(r.comments).filter((c) => !c.resolved).length; if (open) { toast(`Resolve the ${open} open comment${open > 1 ? 's' : ''} first, or request changes`); return; } r.status = 'approved'; r.youDecided = 'Approved'; const t = T[r.task]; t.status = 'done'; t.doneBy = 'Approved by you'; feedPush({ who: 'you', html: `<b>You</b> approved <b>#${t.id} ${esc(t.title)}</b>`, meta: 'now · pull request opened, merge needs you', go: 'review:' + r.id }); toast('Approved. Pull request opened.'); render(); return; }
    if (a === 'reqchanges') { const r = REVIEWS[S.selReview]; r.status = 'changes'; r.youDecided = 'Changes requested'; const t = T[r.task]; t.status = 'doing'; t.running = 'just restarted'; feedPush({ who: 'you', html: `<b>You</b> requested changes on <b>#${t.id}</b>`, meta: 'now · back to ' + AGENTS[t.assignee].name, go: 'task:' + t.id }); toast(`Sent back to ${AGENTS[t.assignee].name}`); render(); return; }
    if (a === 'hire') { S.modal = simpleModal('Hire from template', 'Choose a persona template (n8n engineer, HubSpot analyst, researcher, reviewer, reporter), give it a name and a department, and adjust the toolbox. The new teammate is a prompt and a permission set. No new code.'); render(); return; }
    if (a === 'plugmcp') { S.modal = simpleModal('Plug in an MCP server', 'Paste the server URL or pick one from the catalog. The platform reads its tool list, classifies each tool as read or write, and defaults writes that can reach a live system to <b>ask me</b>. Credentials are stored as names that resolve from the cluster secret store; the platform never sees values.'); render(); return; }
    if (a === 'clone') { toast('Duplicated as a new teammate draft'); return; }
    if (a === 'save') { toast('Saved. Changes apply on the next run.'); return; }
  }

  function moveTask(id, col) {
    const t = T[id];
    if (t.status === col) return;
    if (col === 'done') { toast(`#${id} needs an approved review before Done. Open the review instead.`); if (t.review) { S.view = 'reviews'; S.selReview = t.review; } render(); return; }
    if (col === 'blocked') { t.blocker = { kind: 'teammate', text: 'Blocked by you. Tell the team why in the conversation.' }; }
    else { t.blocker = null; }
    if (col === 'doing') t.running = 'just started';
    t.status = col;
    feedPush({ who: 'you', html: `<b>You</b> moved <b>#${id}</b> to ${({ todo: 'To do', doing: 'In progress', blocked: 'Blocked', review: 'In review' })[col]}`, meta: 'now', go: 'task:' + id });
    S.selTask = id; render();
  }

  function sendMsg(v) {
    v = v.trim(); if (!v) return;
    const t = T[S.selTask];
    const m = v.match(/@(\w+)/);
    const target = m && Object.values(AGENTS).find((a) => a.name.toLowerCase().replace(/\s/g, '') === m[1].toLowerCase());
    t.thread.push({ who: 'you', when: 'now', text: v, routed: target ? target.name : null });
    t.msgs = (t.msgs || 0) + 1;
    feedPush({ who: 'you', html: `<b>You</b> wrote on <b>#${t.id}</b>${target ? ` and routed it to <b>${esc(target.name)}</b>` : ''}`, meta: 'now', go: 'task:' + t.id });
    render();
    const inp = document.getElementById('msgInput'); if (inp) inp.focus();
  }

  function decideApproval(id, yes) {
    const a = APPROVALS[id]; const t = T[a.task];
    a.status = yes ? 'approved' : 'rejected';
    a.decidedNote = yes ? 'Executed with the bound payload. Result attached to the task.' : 'Rejected. The teammate is told why and re-plans.';
    if (yes) { t.status = 'done'; t.doneBy = 'Approved by you'; t.blocker = null; }
    else { t.status = 'doing'; t.running = 're-planning'; t.blocker = null; t.thread.push({ sys: true, text: `You rejected the ${esc(a.tool)} action · ${AGENTS[a.who].name} is re-planning`, go: 'approvals' }); }
    feedPush({ who: 'you', html: `<b>You</b> ${yes ? 'approved' : 'rejected'} <em>${esc(a.title)}</em>`, meta: 'now · ' + a.tool, go: 'approvals' });
    FEED = FEED.filter((f) => !(f.attention && f.go === 'approvals' && f.who === a.who));
    toast(yes ? 'Approved and executed' : 'Rejected');
    render();
  }

  function startPlanning(goal) {
    const st = { phase: 'thinking' }; S.modal = goalModal(st); render();
    setTimeout(() => {
      st.phase = 'plan';
      st.plan = [
        { a: 'ricky', t: 'Map which Gong calls and fields carry next steps' },
        { a: 'brody', t: 'Requirements: digest format, Friday schedule, timezone' },
        { a: 'cody2', t: 'Build the Gong to Slack digest workflow (draft, inactive)' },
        { a: 'verifier', t: 'Verify the digest against two real weeks of calls' } ];
      st.goal = goal; S.modal = goalModal(st); render();
    }, 1400);
  }
  function acceptPlan() {
    const plan = [
      { a: 'ricky', t: 'Map which Gong calls and fields carry next steps', d: 'research' },
      { a: 'brody', t: 'Requirements: digest format, Friday schedule, timezone', d: 'research' },
      { a: 'cody2', t: 'Build the Gong to Slack digest workflow (draft, inactive)', d: 'engineering' },
      { a: 'verifier', t: 'Verify the digest against two real weeks of calls', d: 'engineering' } ];
    const ids = [];
    const pid = 'p-' + (++seq); P()[pid] = { id: pid, name: 'Weekly Gong digest', client: 'Internal' };
    const deptIds = Object.keys(D());
    plan.forEach((p, i) => { const id = ++seq; ids.push(id); addTask({ id, title: p.t, dept: deptIds.includes(p.d) ? p.d : deptIds[0], company: S.company, project: pid, status: i === 0 ? 'doing' : 'todo', assignee: p.a, by: 'peter', running: i === 0 ? 'just started' : '', thread: [ { who: 'peter', when: 'now', text: `From the owner’s goal: weekly Gong digest to #sales on Fridays. ${i === 0 ? 'Start now.' : 'Queued behind #' + (seq - 1) + '.'}` } ] }); });
    T[ids[3]].status = 'blocked'; T[ids[3]].blocker = { kind: 'dependency', text: `Waiting on #${ids[2]} to reach review.` };
    feedPush({ who: 'peter', html: `<b>Peter</b> split your goal <em>“Weekly Gong digest to #sales”</em> into 4 tasks`, meta: 'now · assigned to Ricky, Brody, Cody 2, Verifier', go: 'board' });
    feedPush({ who: 'ricky', html: `<b>Ricky</b> started <b>#${ids[0]}</b>`, meta: 'now', go: 'task:' + ids[0] });
    S.modal = null; S.view = 'board'; S.deptFilter = 'all'; S.project = pid; S.selTask = ids[0]; render();
    toast('Four tasks on the board. Ricky has started.');
  }

  render();
})();
</script>
