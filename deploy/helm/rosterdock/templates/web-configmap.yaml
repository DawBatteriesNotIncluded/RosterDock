apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rosterdock.fullname" . }}-web
  labels:
    {{- include "rosterdock.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ {
        proxy_pass http://{{ include "rosterdock.fullname" . }}-board:{{ .Values.board.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
      }
      # As apps/web/nginx.conf: hashed assets are cached for good, the page is revalidated on every load, or
      # an upgrade keeps serving the old bundle until the cache expires.
      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
      }
      location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
      }
    }
